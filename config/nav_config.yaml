# Navigation config for Unitree Go1
# Contains AMCL, costmaps, DWA local planner and move_base settings.

amcl:
    odom_frame_id: odom
    base_frame_id: base_link
    global_frame_id: map
    scan_topic: /scan

    min_particles: 100
    max_particles: 2000
    kld_err: 0.02
    kld_z: 0.99

    laser_min_range: 0.05
    laser_max_range: 12.0
    laser_z_hit: 0.95
    laser_z_short: 0.1
    laser_z_max: 0.05
    laser_z_rand: 0.05
    laser_sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0

    update_min_d: 0.2
    update_min_a: 0.2


costmap_common_params:
    robot_base_frame: base_link
    transform_tolerance: 0.5
    update_frequency: 5.0
    publish_frequency: 2.0
    footprint: [[0.25,0.18], [0.25,-0.18], [-0.25,-0.18], [-0.25,0.18]]
    robot_radius: 0.25
    inflation_radius: 0.25
    cost_scaling_factor: 10.0
    obstacle_range: 2.5
    raytrace_range: 3.0

    observation_sources: laser_scan
    # Correct the sensor_frame to match your TF tree ('laser')
    laser_scan: {data_type: LaserScan, sensor_frame: laser, topic: /scan, marking: true, clearing: true}


local_costmap:
    global_frame: odom # Local costmap should be in the odom frame
    robot_base_frame: base_link
    update_frequency: 5.0
    publish_frequency: 2.0
    static_map: false
    rolling_window: true # Enable dynamic centering
    width: 6.0
    height: 6.0
    resolution: 0.05
    inflation_radius: 0.25
    observation_sources: laser_scan


global_costmap:
    global_frame: map
    robot_base_frame: base_link
    update_frequency: 1.0
    publish_frequency: 0.5
    # The global costmap should use the map from the SLAM node
    static_map: true
    rolling_window: false
    width: 50.0
    height: 50.0
    resolution: 0.05
    inflation_radius: 0.25
    observation_sources: laser_scan


dwa_local_planner:
    max_vel_x: 1.00
    min_vel_x: 0.0
    max_vel_y: 0.0
    min_vel_y: 0.0
    max_rot_vel: 1.2
    min_rot_vel: -1.2
    acc_lim_x: 1.0
    acc_lim_rot: 1.5
    yaw_goal_tolerance: 6.28 #0.3 
    xy_goal_tolerance: 0.25
    sim_time: 1.7
    sim_granularity: 0.025
    vx_samples: 6
    vtheta_samples: 20
    path_distance_bias: 32.0
    goal_distance_bias: 24.0
    occdist_scale: 0.01
    forward_point_distance: 0.325


move_base:
    base_global_planner: navfn/NavfnROS
    base_local_planner: dwa_local_planner/DWAPlannerROS

    planner_frequency: 1.0
    controller_frequency: 10.0

    controller_patience: 15.0
    planner_patience: 5.0

    recovery_behavior_enabled: true
